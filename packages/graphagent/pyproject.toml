[project]
name = "graphagent"
version = "0.1.0"
description = "Core Reusable Graph Agent Library (Worker Tier) for PrimeKG Knowledge Graph Traversal"
authors = [
    { name = "Cancer Co-Scientist Team", email = "co-scientist@google.com" }
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7.0",
    "google-cloud-spanner>=3.45.0",
    "google-cloud-bigquery>=3.20.0",
    "networkx>=3.2.0",
    "typing-extensions>=4.10.0",
    "opentelemetry-api>=1.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["adk", "tools", "data_loaders"]
