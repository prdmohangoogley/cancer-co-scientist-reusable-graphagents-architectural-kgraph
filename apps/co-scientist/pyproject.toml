[project]
name = "co-scientist-app"
version = "0.1.0"
description = "Cancer Co-Scientist Full-Stack Agentic Application (Orchestrator Tier)"
authors = [
    { name = "Cancer Co-Scientist Team", email = "co-scientist@google.com" }
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "graphagent",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "sse-starlette>=2.1.0",
    "httpx>=0.27.0",
    "google-genai>=0.1.1",
    "opentelemetry-api>=1.24.0",
    "pyjwt>=2.8.0",
    "nest-asyncio>=1.6.0",
]

[tool.uv.sources]
graphagent = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent"]
