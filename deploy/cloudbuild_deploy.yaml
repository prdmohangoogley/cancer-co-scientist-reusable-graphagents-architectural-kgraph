steps:
  - name: 'python:3.11-slim'
    id: 'deploy-agents-in-python311'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -e
        echo "=========================================================="
        echo "Building and Deploying GEA Agents in Native Python 3.11"
        echo "=========================================================="
        python --version
        pip install --upgrade pip
        pip install --no-cache-dir \
            "google-adk>=2.10.0" \
            "google-cloud-aiplatform[agent_engines]>=1.125.0" \
            "google-genai>=2.26.0" \
            "pydantic>=2.0.0" \
            "networkx>=3.0" \
            "opentelemetry-api>=1.26.0" \
            "opentelemetry-sdk>=1.26.0" \
            "opentelemetry-exporter-otlp-proto-http>=1.26.0" \
            "opentelemetry-exporter-gcp-trace>=1.6.0" \
            "opentelemetry-exporter-gcp-monitoring>=1.6.0a0" \
            "opentelemetry-instrumentation-google-genai<=1.1b0"
        
        python deploy/scripts/deploy_dual_gea_agents.py --action update --agent all

timeout: '1800s'
options:
  logging: CLOUD_LOGGING_ONLY
