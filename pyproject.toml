[project]
name = "graphagents-monorepo"
version = "0.1.0"
description = "Reusable Graph Agent Libraries (Workers) and Full-Stack Agentic Applications (Orchestrators)"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Cancer Co-Scientist Team", email = "co-scientist@google.com" }
]
dependencies = [
    "graphagent",
    "co-scientist-app",
    "pydantic>=2.7.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "sse-starlette>=2.1.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pyjwt>=2.15.1",
]


[tool.uv.sources]
graphagent = { workspace = true }
co-scientist-app = { workspace = true }

[tool.uv.workspace]
members = [
    "packages/graphagent",
    "apps/co-scientist",
]

[tool.pytest.ini_options]
testpaths = ["tests", "packages/*/tests", "apps/*/tests"]
pythonpath = [".", "packages/graphagent", "apps/co-scientist"]
markers = [
    "integration: marks tests as live cloud integration tests (deselect with '-m \"not integration\"')",
]

